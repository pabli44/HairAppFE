<div class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm auth-card">
          <div class="card-body p-4 p-md-5">
            <h1 class="h4 mb-1">Sign in</h1>
            <p class="text-muted mb-4">Use your email and profile to access your account.</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
              <div class="form-floating mb-3">
                <input
                  id="email"
                  type="email"
                  class="form-control"
                  placeholder="name@example.com"
                  formControlName="email"
                  autocomplete="email"
                  [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
                />
                <label for="email">Email</label>
                <div class="invalid-feedback">Enter a valid email.</div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="profile">Profile</label>
                <select
                  id="profile"
                  class="form-select"
                  formControlName="profile"
                  [class.is-invalid]="loginForm.get('profile')?.touched && loginForm.get('profile')?.invalid"
                >
                  <option value="" disabled>Select profile</option>
                  <option value="1">Client</option>
                  <option value="2">Professional</option>
                </select>
                <div class="invalid-feedback">Select a profile.</div>
              </div>

              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <input
                    id="password"
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control"
                    placeholder="Password"
                    formControlName="password"
                    autocomplete="current-password"
                    [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    (click)="showPassword = !showPassword"
                    [attr.aria-pressed]="showPassword"
                  >
                    {{ showPassword ? 'Hide' : 'Show' }}
                  </button>
                </div>
                <div
                  class="invalid-feedback d-block"
                  [class.d-none]="!(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)"
                >
                  Password is required.
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-success w-100"
                [disabled]="loginForm.invalid || isSubmitting"
              >
                {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
              </button>
            </form>

            <div class="auth-divider"></div>
            <p class="mb-0 text-muted small">
              New here? <a [routerLink]="['/register']">Create an account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
