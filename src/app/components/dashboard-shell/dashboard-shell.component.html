<div class="dashboard-shell">
  <aside class="sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand">
      <span class="brand-icon">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="6" cy="18" r="3"></circle>
          <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
          <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
          <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
        </svg>
      </span>
      <span class="brand-text">HairApp</span>
    </div>
    <nav class="sidebar-nav">
      @if (isProfessional) {
        <a routerLink="/profile/professional" routerLinkActive="active" class="nav-link">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>{{ 'SHELL.SERVICES' | translate }}</span>
        </a>
      } @else {
        <a routerLink="/profile/client/records" routerLinkActive="active" class="nav-link">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>{{ 'SHELL.RECORDS' | translate }}</span>
        </a>
        <a routerLink="/profile/client/create-new-service" routerLinkActive="active" class="nav-link">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>{{ 'SHELL.CREATE_SERVICE' | translate }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <button type="button" class="sidebar-logout" (click)="logout()">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>{{ 'SHELL.LOGOUT' | translate }}</span>
      </button>
    </div>
  </aside>
  <div class="dashboard-main">
    <header class="dashboard-header">
      <button type="button" class="sidebar-toggle" (click)="sidebarOpen = !sidebarOpen" [attr.aria-label]="'SHELL.MENU' | translate">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="header-user">
        <div class="avatar">{{ nameInitial }}</div>
        <div class="header-user-text">
          <div class="header-greeting">{{ 'SHELL.WELCOME_BACK' | translate }}</div>
          <div class="header-name">{{ name }}</div>
        </div>
      </div>
      <div class="header-role">{{ roleLabel | translate }}</div>
      <app-language-switcher />
    </header>
    <main class="dashboard-content">
      <router-outlet />
    </main>
  </div>
</div>
