<div class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <div class="card shadow-sm auth-card">
          <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-start justify-content-between gap-3 flex-wrap">
              <div>
                <h1 class="h4 mb-1">Create account</h1>
                <p class="text-muted mb-4">Fill in your details to register.</p>
              </div>
              <div class="text-muted small">
                Already have an account? <a [routerLink]="['/login']">Sign in</a>
              </div>
            </div>

            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <label class="form-label" for="name">Name</label>
                  <input
                    id="name"
                    type="text"
                    formControlName="name"
                    class="form-control"
                    alfabeticoTag
                    autocomplete="given-name"
                    [class.is-invalid]="registerForm.get('name')?.touched && registerForm.get('name')?.invalid"
                  />
                  <div class="invalid-feedback">Name is required.</div>
                </div>

                <div class="col-12 col-md-4">
                  <label class="form-label" for="lastName">Last name</label>
                  <input
                    id="lastName"
                    type="text"
                    formControlName="lastName"
                    class="form-control"
                    alfabeticoTag
                    autocomplete="family-name"
                    [class.is-invalid]="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid"
                  />
                  <div class="invalid-feedback">Last name is required.</div>
                </div>

                <div class="col-12 col-md-4">
                  <label class="form-label" for="phone">Phone</label>
                  <input
                    id="phone"
                    type="text"
                    formControlName="phone"
                    class="form-control"
                    appNumerosTag
                    inputmode="numeric"
                    autocomplete="tel"
                    [class.is-invalid]="registerForm.get('phone')?.touched && registerForm.get('phone')?.invalid"
                  />
                  <div class="invalid-feedback">Enter a valid phone (max 10 digits).</div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="email">Email</label>
                  <input
                    id="email"
                    type="email"
                    formControlName="email"
                    class="form-control"
                    placeholder="name@example.com"
                    autocomplete="email"
                    [class.is-invalid]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
                  />
                  <div class="invalid-feedback">Enter a valid email.</div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="userName">Username</label>
                  <input
                    id="userName"
                    type="text"
                    formControlName="userName"
                    class="form-control"
                    autocomplete="username"
                    [class.is-invalid]="registerForm.get('userName')?.touched && registerForm.get('userName')?.invalid"
                  />
                  <div class="invalid-feedback">Username is required.</div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="password">Password</label>
                  <div class="input-group">
                    <input
                      id="password"
                      [type]="showPassword ? 'text' : 'password'"
                      formControlName="password"
                      class="form-control"
                      autocomplete="new-password"
                      [class.is-invalid]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
                    />
                    <button
                      type="button"
                      class="btn btn-outline-secondary"
                      (click)="showPassword = !showPassword"
                      [attr.aria-pressed]="showPassword"
                    >
                      {{ showPassword ? 'Hide' : 'Show' }}
                    </button>
                  </div>
                  <div class="invalid-feedback d-block" [class.d-none]="!(registerForm.get('password')?.touched && registerForm.get('password')?.invalid)">
                    Password is required (min 6 characters).
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label" for="profile">Profile</label>
                  <select
                    id="profile"
                    class="form-select"
                    formControlName="profile"
                    (change)="changeProfile($event)"
                    [class.is-invalid]="registerForm.get('profile')?.touched && registerForm.get('profile')?.invalid"
                  >
                    <option value="" disabled>Select profile</option>
                    <option value="1">Client</option>
                    <option value="2">Professional</option>
                  </select>
                  <div class="invalid-feedback">Select a profile.</div>
                </div>

                <div class="col-12">
                  <label class="form-label" for="adress">Adress</label>
                  <input
                    id="adress"
                    type="text"
                    formControlName="adress"
                    class="form-control"
                    autocomplete="street-address"
                    [class.is-invalid]="registerForm.get('adress')?.touched && registerForm.get('adress')?.invalid"
                  />
                  <div class="invalid-feedback">Adress is required.</div>
                </div>
              </div>

              <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap mt-4">
                <button
                  type="submit"
                  class="btn btn-success"
                  [disabled]="registerForm.invalid || isSubmitting"
                >
                  {{ isSubmitting ? 'Creating…' : 'Create account' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
