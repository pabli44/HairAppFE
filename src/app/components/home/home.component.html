<section class="hero py-5">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-12 col-lg-6 mb-4 mb-lg-0">
        <h1 class="display-4 mb-3">{{ 'HOME.TITLE' | translate }}</h1>
        <p class="lead text-muted mb-4">{{ 'HOME.SUBTITLE' | translate }}</p>
        <a class="btn btn-primary btn-lg" [routerLink]="['/register']">{{ 'HOME.CTA' | translate }}</a>
      </div>
      <div class="col-12 col-lg-6">
        <img src="assets/images/home-hero.svg" alt="{{ 'HOME.HERO_ALT' | translate }}" class="img-fluid">
      </div>
    </div>
  </div>
</section>
